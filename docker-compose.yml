# One command brings up the whole system:  docker compose up -d
#
# Services:
#   neo4j     graph store                 http://localhost:7474
#   postgres  accounts, limits, usage, chat history, agent memory
#   redis     cache / rate-limit counters / job status
#   api       FastAPI service             http://localhost:8000  (docs at /docs)
#   proxy     TLS + both web apps + /api  the public entrypoint (80/443)
#             chat UI at /, admin console at /admin
#   worker    ingest queue worker (Arq)   profile: worker  — see note below
#   ollama    local models                profile: local
#
# RAM / CPU per service are capped via .env (the *_MEM_LIMIT / *_CPU_LIMIT
# knobs). The defaults target a 4 vCPU / 12 GB VPS and sum to ~7.6 GB of limits,
# leaving ~4 GB for the OS, the host page cache (which is what makes the DuckDB
# vector scans fast) and a `docker compose build`. Raise them on a bigger box.
#
# Only the proxy publishes to the network. Every other `ports:` entry below is
# bound to 127.0.0.1 and is reached over an SSH tunnel. `make ports` fails if a
# prefix ever goes missing — that binding is the control, because `ufw deny`
# does not close a published container port (Docker's iptables rules run first).
#
# Ingest runs inside the API by default. The separate `worker` profile exists
# for deployments using the neo4j vector provider — it CANNOT be used with the
# duckdb provider, which needs one process to own each tenant's database file
# (the worker refuses to start in that combination rather than corrupting one).

name: agentic-graph-rag

services:
  neo4j:
    image: neo4j:5.23
    # Come back after a Docker Desktop / host restart. `unless-stopped` (not
    # `always`) so an explicit `docker compose stop|down` stays stopped.
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${GRAPHRAG_NEO4J_PASSWORD:-12345678}
      NEO4J_PLUGINS: '["apoc"]'
      # Only the namespaces the code calls (apoc.merge.relationship,
      # apoc.refactor.mergeNodes) — NOT apoc.*, which would also unlock
      # apoc.load.* and apoc.export.*: network and file reach from inside the
      # database, a gift to any Cypher execution nobody has found yet. Both
      # call sites degrade to plain Cypher if APOC is missing, so narrowing
      # this can never take the deployment down.
      NEO4J_dbms_security_procedures_unrestricted: apoc.merge.*,apoc.refactor.*
      # Heap + pagecache must fit inside NEO4J_MEM_LIMIT with room for the JVM
      # itself (metaspace, thread stacks, direct buffers — allow ~500m);
      # 1g + 768m under a 2560m cap leaves ~800m of headroom.
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-768M}
    # Loopback only — the API reaches Neo4j in-network as neo4j:7687. On a VPS
    # a 0.0.0.0 bind would expose the database (with a guessable password) to
    # the internet; use an SSH tunnel for the browser UI when remote.
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j_data:/data"]
    deploy:
      resources:
        limits: { cpus: "${NEO4J_CPU_LIMIT:-2}", memory: "${NEO4J_MEM_LIMIT:-2560m}" }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graphrag}
      POSTGRES_PASSWORD: ${GRAPHRAG_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-graphrag}
    # Sized for the 1g cap: shared_buffers is the classic 25%, and
    # max_connections is deliberately small — the API pool (5+5) plus the
    # checkpointer pool (4) plus headroom, not the default 100 idle backends.
    # 64 (not 40) leaves room for the llmlens api/worker pools, which share
    # this server (separate `llmlens` database) under the integrations overlay.
    #
    # work_mem is per sort/hash NODE, not per connection: the worst case is
    # roughly max_connections x work_mem x a few, so it stays modest even with
    # memory to spare. shared_buffers is where the extra GB actually goes.
    command: >
      postgres -c shared_buffers=256MB -c max_connections=64
               -c work_mem=12MB -c maintenance_work_mem=128MB
               -c effective_cache_size=768MB
    # Loopback only — in-network clients use postgres:5432.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    deploy:
      resources:
        limits: { cpus: "${POSTGRES_CPU_LIMIT:-1}", memory: "${POSTGRES_MEM_LIMIT:-1g}" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-graphrag} -d ${POSTGRES_DB:-graphrag}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    # Plain redis is enough now that durable agent memory lives in Postgres.
    # (It was redis-stack only because the LangGraph Redis checkpointer issues
    # FT.* commands that need the RediSearch modules.) Redis now holds caches,
    # rate-limit windows and live job status — all rebuildable, hence the
    # allkeys-lru eviction.
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory sits BELOW the container cap on purpose: it bounds the keyspace,
    # while fragmentation and copy-on-write sit on top of it. Set equal to the
    # cap, Redis gets OOM-killed at the point it should have started evicting.
    command: >
      redis-server --maxmemory ${REDIS_MAXMEMORY:-288mb}
                   --maxmemory-policy allkeys-lru --save ""
    # Loopback only — Redis has NO auth here; a 0.0.0.0:6379 bind on a public
    # host is a well-known instant compromise. In-network clients use redis:6379.
    ports: ["127.0.0.1:6379:6379"]
    # No volume: everything here is derived state. Dropping the old redis-stack
    # volume also avoids an RDB the plain image cannot read.
    deploy:
      resources:
        limits: { cpus: "${REDIS_CPU_LIMIT:-0.5}", memory: "${REDIS_MEM_LIMIT:-384m}" }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    restart: unless-stopped
    env_file: [.env]
    environment: &backend_env
      GRAPHRAG_PROFILE: ${GRAPHRAG_PROFILE:-production}
      GRAPHRAG_NEO4J_URI: bolt://neo4j:7687
      GRAPHRAG_REDIS_URL: redis://redis:6379/0
      GRAPHRAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-graphrag}:${GRAPHRAG_POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-graphrag}
      # Defaults to the Ollama on the *host* (reusing models you've pulled).
      # Running the bundled service instead? set
      # GRAPHRAG_OLLAMA_BASE_URL_INTERNAL=http://ollama:11434 in .env.
      GRAPHRAG_OLLAMA_BASE_URL: ${GRAPHRAG_OLLAMA_BASE_URL_INTERNAL:-http://host.docker.internal:11434}
      # Cap CPU-thread fan-out so limits are actually respected.
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-3}
      TOKENIZERS_PARALLELISM: "false"
    extra_hosts: &host_gateway
      # On Linux, host.docker.internal doesn't exist unless mapped explicitly
      # (Docker Desktop provides it; plain dockerd does not).
      - "host.docker.internal:host-gateway"
    # Loopback only: handy for local /docs, invisible from the network. The
    # public entrypoint is the proxy on 80/443.
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes: ["./data:/app/data"]
    deploy:
      resources:
        limits: { cpus: "${API_CPU_LIMIT:-3}", memory: "${API_MEM_LIMIT:-3g}" }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s   # first boot may download local models

  # Opt-in: `docker compose --profile worker up`. Requires
  # GRAPHRAG_USE_WORKER=1 so the API dispatches to it, and a vector provider
  # other than duckdb (the worker refuses to start otherwise).
  worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    restart: unless-stopped
    profiles: ["worker"]
    command: ["arq", "graphrag.worker.WorkerSettings"]
    env_file: [.env]
    environment:
      <<: *backend_env
      GRAPHRAG_WORKER_CONCURRENCY: ${GRAPHRAG_WORKER_CONCURRENCY:-2}
    extra_hosts: *host_gateway
    # The shared image's HEALTHCHECK curls :8000/health, but the worker runs arq,
    # not the web server — inheriting it would flap to "unhealthy" forever. Check
    # what the worker actually depends on instead: a reachable Redis queue.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.Redis.from_url(os.environ['GRAPHRAG_REDIS_URL']).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes: ["./data:/app/data"]
    deploy:
      resources:
        limits: { cpus: "${WORKER_CPU_LIMIT:-1}", memory: "${WORKER_MEM_LIMIT:-1g}" }

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["local"]
    # Loopback only — lets you `ollama pull` from the host; the API reaches it
    # in-network (set GRAPHRAG_OLLAMA_BASE_URL_INTERNAL=http://ollama:11434).
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    deploy:
      resources:
        limits: { cpus: "${OLLAMA_CPU_LIMIT:-4}", memory: "${OLLAMA_MEM_LIMIT:-8g}" }

  # TLS, static hosting for both web apps, and the API reverse proxy. This is
  # the public entrypoint (80/443) — every other published port above is bound
  # to 127.0.0.1, so from the network only the proxy exists.
  #
  # It is built rather than pulled because the image carries the built SPAs:
  # `docker compose up -d --build proxy` after a UI change.
  proxy:
    build: { context: ., dockerfile: docker/Dockerfile.proxy }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}   # -> localhost or a domain to enable HTTPS
      TLS_EMAIL: ${TLS_EMAIL:-}
      # A second hostname that should 308 to SITE_ADDRESS (e.g. the apex when
      # the site lives at www). The default is NOT empty on purpose: this
      # service has no env_file, so compose always sets the key, and an empty
      # value would render an empty site address in the Caddyfile and fail the
      # parse. `http://` also keeps automatic HTTPS off for the unused block.
      # Must match the default in docker/Caddyfile.
      REDIRECT_FROM: ${REDIRECT_FROM:-http://localhost:2020}
      # Caddy refuses bodies above this before they reach the API. Keep it
      # strictly ABOVE api.max_upload_mb in configs/*.yaml — this bounds the
      # whole multipart body, the API bounds the file inside it, so equal
      # values reject a file of exactly the advertised size.
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-26}
    ports: ["80:80", "443:443"]
    volumes:
      # Bind-mounted as well as baked into the image, so fixing the config that
      # is the only way into the deployment is a restart, not a rebuild.
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # persisted certs
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "${PROXY_CPU_LIMIT:-1}", memory: "${PROXY_MEM_LIMIT:-256m}" }
    healthcheck:
      # Caddy's local admin API, not the site: with a real SITE_ADDRESS the site
      # redirects :80 to HTTPS and a plain wget fails on the certificate name.
      #
      # 127.0.0.1, NOT localhost. Caddy binds the admin API to IPv4 only, while
      # `localhost` inside the container resolves to ::1 first — so the hostname
      # form gets "connection refused" and the container sits unhealthy forever
      # while serving traffic perfectly well.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  neo4j_data:
  postgres_data:
  ollama_data:
  caddy_data:
  caddy_config:
